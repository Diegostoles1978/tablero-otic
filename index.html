<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC — Gestión de Procesos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .critica { color: #f87171 !important; font-weight: 800; }
        .advertencia { color: #fbbf24 !important; font-weight: 800; }
        .en-curso { color: #34d399 !important; font-weight: 800; }
        .pendiente { color: #94a3b8 !important; }
        .card-otic { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid #334155; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 p-4 md:p-8">

    <header class="max-w-[1400px] mx-auto mb-8 bg-slate-900/80 p-8 rounded-[2rem] border border-slate-800 shadow-2xl">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-2xl font-black text-white uppercase tracking-tighter italic">Seguimiento Contractual OTIC</h1>
                <p id="fechaActual" class="text-indigo-400 font-bold mt-1 uppercase text-[10px] tracking-widest"></p>
            </div>
            <div class="flex gap-4">
                <div class="bg-black/40 px-6 py-4 rounded-2xl border border-slate-800 text-center">
                    <p class="text-[10px] font-black text-slate-500 uppercase mb-1 italic">Ejecución Total</p>
                    <p id="totalPresupuesto" class="text-2xl font-black text-emerald-400">$0</p>
                </div>
                <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-12 h-12 rounded-xl transition-all flex items-center justify-center">
                    <i class="fas fa-link"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
            <div class="bg-rose-500/10 border border-rose-500/20 p-4 rounded-xl text-center">
                <p class="text-[10px] font-black text-rose-500 uppercase">Críticas</p>
                <p id="countCriticas" class="text-2xl font-black text-rose-500">0</p>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl text-center">
                <p class="text-[10px] font-black text-amber-500 uppercase">Alertas</p>
                <p id="countAdvertencias" class="text-2xl font-black text-amber-500">0</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl text-center">
                <p class="text-[10px] font-black text-emerald-400 uppercase">En Curso</p>
                <p id="countEnCurso" class="text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800/30 border border-slate-700/30 p-4 rounded-xl text-center">
                <p class="text-[10px] font-black text-slate-500 uppercase">Sin Iniciar</p>
                <p id="countPendientes" class="text-2xl font-black">0</p>
            </div>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-[1400px] mx-auto mb-8 bg-slate-800 p-6 rounded-2xl border border-indigo-500">
        <input type="text" id="csvUrl" placeholder="Pega la URL del CSV aquí" class="w-full p-4 bg-slate-950 rounded-xl text-white outline-none mb-4 border border-slate-700">
        <button onclick="guardarConfig()" class="w-full bg-emerald-600 py-4 rounded-xl font-black uppercase text-white">Conectar Datos</button>
    </div>

    <main id="tablero" class="max-w-[1400px] mx-auto space-y-10 pb-24"></main>

    <script>
        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function getStatusInfo(fechaLim, estadoTexto) {
            if (!fechaLim || fechaLim === "" || fechaLim.includes("Fecha")) return { color: "pendiente", crit: 0, adv: 0 };
            const hoy = new Date();
            const limite = new Date(fechaLim);
            const diffDays = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 || (estadoTexto && estadoTexto.toLowerCase().includes("atrasado"))) return { color: "critica", crit: 1, adv: 0 };
            if (diffDays <= 2) return { color: "advertencia", crit: 0, adv: 1 };
            return { color: "en-curso", crit: 0, adv: 0 };
        }

        async function render() {
            const url = localStorage.getItem('otic_final_v10');
            if (!url) return;

            try {
                const res = await fetch(url);
                const csvText = await res.text();
                const filas = csvText.split(/\r?\n/).map(f => f.split(',').map(c => c.trim().replace(/"/g, '')));
                
                let stats = { totalB: 0, crit: 0, adv: 0, curso: 0, pend: 0 };
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                // Buscamos cada bloque de proyecto
                for (let i = 0; i < filas.length; i++) {
                    // El identificador es que la columna 1 tenga "DAFP" o el nombre del Firewall
                    if (filas[i][1] && filas[i][1].toUpperCase().includes("DAFP")) {
                        
                        const nombre = filas[i][1];
                        const responsable = filas[i][7] ? filas[i][7].split(":")[1] || filas[i][7] : "No asignado";
                        const modalidad = filas[i+1] ? filas[i+1][1] : "---";
                        
                        // Presupuesto: fila i+2, columna 1
                        const pRaw = filas[i+2] && filas[i+2][1] ? filas[i+2][1].replace(/[^0-9]/g, '') : "0";
                        const presupuesto = parseInt(pRaw);
                        stats.totalB += presupuesto;

                        // Las actividades están siempre 6 filas después del nombre
                        const estados = filas[i+7] || [];
                        const fechas = filas[i+8] || [];

                        const sFicha = getStatusInfo(fechas[1], estados[1]);
                        const sSecop = getStatusInfo(fechas[2], estados[2]);
                        const sAnalis = getStatusInfo(fechas[3], estados[3]);
                        const sPrevio = getStatusInfo(fechas[4], estados[4]);
                        const sRiesgo = getStatusInfo(fechas[5], estados[5]);

                        if (sFicha.crit || sSecop.crit) stats.crit++;
                        else if (sFicha.adv || sSecop.adv) stats.adv++;
                        else stats.curso++;

                        container.innerHTML += `
                            <div class="card-otic rounded-[2.5rem] p-8 shadow-2xl">
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 border-b border-slate-700/50 pb-8 uppercase">
                                    <div><p class="text-[9px] font-black text-slate-500 mb-1 tracking-widest">Proceso</p><p class="text-white font-bold text-xs leading-tight">${nombre}</p></div>
                                    <div><p class="text-[9px] font-black text-slate-500 mb-1 tracking-widest">Modalidad</p><p class="text-indigo-400 font-bold text-xs">${modalidad}</p></div>
                                    <div><p class="text-[9px] font-black text-slate-500 mb-2 tracking-widest">Presupuesto</p><p class="text-emerald-400 font-mono font-bold text-lg">$${presupuesto.toLocaleString('es-CO')}</p></div>
                                    <div><p class="text-[9px] font-black text-slate-500 mb-1 tracking-widest">Responsable</p><p class="text-slate-300 font-bold text-xs underline decoration-indigo-500/30">${responsable}</p></div>
                                </div>

                                <div class="grid grid-cols-2 lg:grid-cols-7 gap-3">
                                    ${etapa("Ficha Técnica", estados[1], fechas[1], sFicha.color)}
                                    ${etapa("Publicación", estados[2], fechas[2], sSecop.color)}
                                    ${etapa("Análisis Sector", estados[3], fechas[3], sAnalis.color)}
                                    ${etapa("Estudios Previos", estados[4], fechas[4], sPrevio.color)}
                                    ${etapa("Matriz Riesgos", estados[5], fechas[5], sRiesgo.color)}
                                    
                                    <div class="bg-indigo-900/20 p-4 rounded-2xl border border-indigo-500/30 text-center">
                                        <p class="text-[9px] font-black uppercase mb-1 text-indigo-400">SECOP II</p>
                                        <div class="text-[9px] text-slate-400 font-medium">
                                            <p>RAD: ${filas[i+22] ? filas[i+22][18] || '--' : '--'}</p>
                                            <p class="bg-indigo-600/30 text-white font-bold px-1 rounded inline-block mt-1">ID: ${filas[i+22] ? filas[i+22][21] || '--' : '--'}</p>
                                        </div>
                                    </div>

                                    ${etapa("Evaluación", estados[6], fechas[6], "pendiente")}
                                </div>
                            </div>
                        `;
                        // Saltamos al siguiente bloque (aprox 30 filas)
                        i += 25;
                    }
                }

                document.getElementById('totalPresupuesto').innerText = '$' + stats.totalB.toLocaleString('es-CO');
                document.getElementById('countCriticas').innerText = stats.crit;
                document.getElementById('countAdvertencias').innerText = stats.adv;
                document.getElementById('countEnCurso').innerText = stats.curso;
                document.getElementById('countPendientes').innerText = stats.pend;

            } catch (e) { console.error("Error:", e); }
        }

        function etapa(tit, est, fec, col) {
            return `<div class="bg-black/30 p-4 rounded-2xl border border-slate-800/50 text-center">
                <p class="text-[9px] font-black uppercase mb-1 ${col}">${tit}</p>
                <p class="text-[10px] font-bold text-white leading-tight mb-1">${est || '---'}</p>
                <p class="text-[9px] font-mono text-slate-600 italic">${fec || '--'}</p>
            </div>`;
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            localStorage.setItem('otic_final_v10', document.getElementById('csvUrl').value.trim());
            location.reload();
        }
        window.onload = render;
    </script>
</body>
</html>
