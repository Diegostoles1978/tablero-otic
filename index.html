<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento OTIC - DAFP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans p-6">

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl gap-4">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight">Seguimiento Contractual OTIC</h1>
            <p class="text-indigo-400 font-medium"><i class="fas fa-landmark"></i> Departamento Administrativo de la Función Pública</p>
        </div>
        <div class="flex gap-4">
            <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-2">
                <i class="fas fa-database"></i> Datos
            </button>
            <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <div id="configPanel" class="hidden max-w-7xl mx-auto mb-8 bg-indigo-900/30 p-6 rounded-2xl border border-indigo-500/50 backdrop-blur-sm">
        <label class="block text-sm font-bold mb-2 text-indigo-200">URL del Google Sheets (Publicado como CSV):</label>
        <div class="flex gap-3">
            <input type="text" id="csvUrl" placeholder="Pega el enlace de publicación aquí..." class="flex-1 p-3 rounded-xl bg-slate-800 border border-slate-600 focus:outline-none focus:border-indigo-400 text-sm">
            <button onclick="guardarConfig()" class="bg-green-600 hover:bg-green-500 px-8 py-3 rounded-xl font-bold shadow-lg transition">Conectar</button>
        </div>
    </div>

    <div id="gridContratos" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-20 text-slate-500 animate-pulse">Cargando base de datos estratégica...</div>
    </div>

    <script>
        async function cargarTablero() {
            const url = localStorage.getItem('otic_sheet_url');
            if (!url) {
                document.getElementById('gridContratos').innerHTML = '<div class="col-span-full text-center py-20 text-indigo-400 bg-slate-800 rounded-2xl border-2 border-dashed border-slate-700">Haz clic en el botón "Datos" para conectar tu Google Sheets.</div>';
                return;
            }

            try {
                const res = await fetch(url);
                const csv = await res.text();
                const filas = csv.split('\n').slice(1);
                const container = document.getElementById('gridContratos');
                container.innerHTML = '';

                filas.forEach(f => {
                    const c = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // Soporta comas dentro de textos
                    if (c.length < 10) return;

                    // MAPEÓ SEGÚN TU NUEVO EXCEL:
                    // 0:ID, 1:TIPO, 2:MODALIDAD, 3:MES, 4:RESPONSABLE, 5:OBJETO, 6:PRESUPUESTO, 
                    // 7:ADICIONES, 8:TOTAL, 9:PLAZO, 10:ID_SECOP, 11:ETAPA, 12:AVANCE, 
                    // 13:AL_ROJAS, 14:AL_AMARILLAS, 15:LINK_SECOP, 16:LINK_DOCS

                    const presupuesto = parseFloat(c[8].replace(/[^0-9.-]+/g,"")) || 0;
                    const avance = parseInt(c[12]) || 0;
                    const colorBorde = avance === 100 ? 'border-green-500' : 'border-slate-700';

                    const card = `
                        <div class="bg-slate-800 border-t-4 ${colorBorde} rounded-2xl p-6 shadow-xl hover:scale-[1.02] transition-transform duration-300">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[10px] uppercase tracking-widest font-bold px-2 py-1 bg-slate-700 rounded text-indigo-300">${c[2]}</span>
                                <div class="flex gap-1">
                                    <span class="text-xs bg-rose-500/20 text-rose-400 px-2 py-1 rounded font-bold"><i class="fas fa-bell"></i> ${c[13]}</span>
                                    <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-1 rounded font-bold"><i class="fas fa-exclamation-triangle"></i> ${c[14]}</span>
                                </div>
                            </div>

                            <h3 class="font-bold text-lg mb-1 truncate" title="${c[0]}">${c[0]}</h3>
                            <p class="text-xs text-slate-400 mb-4 h-8 line-clamp-2">${c[5]}</p>

                            <div class="grid grid-cols-2 gap-4 mb-6 bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                <div>
                                    <p class="text-[10px] text-slate-500 uppercase font-bold">Presupuesto Total</p>
                                    <p class="text-sm font-mono text-emerald-400 font-bold">$${presupuesto.toLocaleString()}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] text-slate-500 uppercase font-bold">Vence</p>
                                    <p class="text-sm font-bold text-slate-300">${c[9]}</p>
                                </div>
                            </div>

                            <div class="mb-6">
                                <div class="flex justify-between text-[10px] font-bold mb-1 uppercase tracking-tight">
                                    <span class="text-indigo-400">${c[11]}</span>
                                    <span class="text-orange-400">${avance}%</span>
                                </div>
                                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                    <div class="bg-gradient-to-r from-orange-600 to-orange-400 h-full transition-all duration-1000" style="width: ${avance}%"></div>
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <a href="${c[15]}" target="_blank" class="flex-1 text-center py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-[10px] font-black transition uppercase">SECOP</a>
                                <a href="${c[16]}" target="_blank" class="flex-1 text-center py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-[10px] font-black transition uppercase">Expediente</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                alert("Error al leer los datos. Verifica la publicación del CSV.");
            }
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            localStorage.setItem('otic_sheet_url', document.getElementById('csvUrl').value);
            location.reload();
        }
        window.onload = cargarTablero;
    </script>
</body>
</html>
