<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC - DAFP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-300 min-h-screen pb-10">

    <header class="bg-[#1e293b] border-b border-slate-700 p-6 mb-8 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-white tracking-tighter uppercase">DAFP — OTIC 2026</h1>
                <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest text-shadow">Seguimiento de Procesos Contractuales</p>
            </div>
            <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg flex items-center gap-2">
                <i class="fas fa-link"></i> VINCULAR EXCEL
            </button>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-7xl mx-auto mb-8 px-6">
        <div class="bg-slate-800 border border-indigo-500/50 p-6 rounded-2xl shadow-inner">
            <h2 class="text-white text-sm font-bold mb-4 uppercase tracking-tight">Configuración de Datos (CSV)</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="csvUrl" placeholder="Pega aquí la URL terminada en &output=csv" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-indigo-100 outline-none focus:border-indigo-500 transition-colors">
                <button onclick="guardarConfig()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-xl font-black transition-all uppercase text-xs tracking-widest">Conectar</button>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tablero">
        <div class="col-span-full text-center py-24 text-slate-500">
            <i class="fas fa-file-csv mb-4 text-4xl block opacity-20"></i>
            <p class="font-medium">Sistema listo. Por favor vincula la URL de Google Sheets para visualizar los procesos.</p>
        </div>
    </main>

    <script>
        // Función de parseo robusto para evitar errores por comas internas
        function parsearCSV(linea) {
            const regex = /(".*?"|[^",\s]+)(?=\s*,|\s*$)/g;
            const matches = linea.match(regex);
            return matches ? matches.map(m => m.replace(/^"|"$/g, '').trim()) : [];
        }

        async function renderizarTablero() {
            const url = localStorage.getItem('dafp_otic_csv_url');
            if (!url) return;

            try {
                const response = await fetch(url);
                const data = await response.text();
                // SALTO DE SEGURIDAD: Omitimos las primeras 2 filas (Título institucional y Encabezados)
                const filas = data.split(/\r?\n/).slice(2); 
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                filas.forEach(fila => {
                    const c = parsearCSV(fila);
                    
                    // VALIDACIÓN: Si no hay nombre de proceso (Columna C / Índice 2), ignorar fila
                    if (!c[2] || c[2] === "" || c[2].toLowerCase().includes("nombre del proceso")) return;

                    // Limpieza y formato de presupuesto (Columna E / Índice 4)
                    const presupuestoLimpio = c[4] ? c[4].replace(/[^0-9]/g, '') : "0";
                    const presupuestoNum = parseInt(presupuestoLimpio) || 0;
                    
                    // Estado (Columna I / Índice 8)
                    const estado = c[8] ? c[8].trim() : 'Sin iniciar';
                    const esAtrasado = estado.toLowerCase() === 'atrasado';
                    const colorBorde = esAtrasado ? 'border-rose-500 shadow-rose-900/20' : 'border-indigo-500 shadow-indigo-900/20';

                    container.innerHTML += `
                        <div class="bg-[#1e293b] border-t-4 ${colorBorde} rounded-2xl p-6 shadow-2xl flex flex-col justify-between hover:scale-[1.02] transition-transform duration-300">
                            <div>
                                <div class="flex justify-between items-start mb-4">
                                    <span class="text-[9px] bg-slate-900 px-2.5 py-1 rounded-md text-indigo-300 font-black border border-indigo-500/20 uppercase tracking-tighter italic">
                                        ${c[3] || 'Modalidad'}
                                    </span>
                                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${c[1] || ''}</span>
                                </div>

                                <h3 class="text-white font-bold text-base leading-tight mb-4 uppercase tracking-tight h-12 line-clamp-2" title="${c[2]}">
                                    ${c[2]}
                                </h3>

                                <div class="flex items-center gap-2 text-xs text-slate-400 mb-6 border-b border-slate-700/50 pb-4 italic">
                                    <i class="fas fa-user-circle text-indigo-500 opacity-50"></i>
                                    <span>${c[6] || 'Responsable no asignado'}</span>
                                </div>

                                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 mb-2 shadow-inner">
                                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-1 tracking-widest">Presupuesto Estimado</p>
                                    <p class="text-xl font-mono font-bold text-emerald-400 leading-none">
                                        $${presupuestoNum.toLocaleString('es-CO')}
                                    </p>
                                </div>
                            </div>

                            <div class="pt-4 mt-4 border-t border-slate-700/50 flex justify-between items-end">
                                <div>
                                    <p class="text-[9px] text-slate-500 font-black uppercase mb-0.5">Estado</p>
                                    <p class="text-xs font-black ${esAtrasado ? 'text-rose-500' : 'text-indigo-400'} uppercase">
                                        ${estado}
                                    </p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] text-slate-500 font-black uppercase mb-0.5">Entrega Ficha</p>
                                    <p class="text-xs font-bold text-slate-300">${c[7] || '--'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error en validación de datos:", error);
            }
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        
        function guardarConfig() {
            const url = document.getElementById('csvUrl').value.trim();
            if(url) {
                localStorage.setItem('dafp_otic_csv_url', url);
                location.reload();
            }
        }

        window.onload = renderizarTablero;
    </script>
</body>
</html>
