<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento OTIC - DAFP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans p-6">

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800 p-8 rounded-2xl border-l-8 border-indigo-600 shadow-2xl gap-4">
        <div>
            <h1 class="text-3xl font-black tracking-tighter">DAFP — SEGUIMIENTO OTIC 2026</h1>
            <p class="text-slate-400 flex items-center gap-2"><i class="fas fa-microchip text-indigo-400"></i> Gestión de Procesos Contractuales</p>
        </div>
        <div class="flex gap-3">
            <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg">
                <i class="fas fa-database"></i> Conectar Excel
            </button>
            <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-xl transition-all">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <div id="configPanel" class="hidden max-w-7xl mx-auto mb-8 bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <h2 class="text-sm font-bold uppercase text-indigo-400 mb-4">Configuración de Fuente de Datos</h2>
        <div class="flex flex-col md:flex-row gap-4">
            <input type="text" id="csvUrl" placeholder="Pega aquí la URL de Google Sheets (terminada en &output=csv)" class="flex-1 p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="guardarConfig()" class="bg-green-600 hover:bg-green-500 px-10 py-3 rounded-xl font-black transition-all">CONECTAR</button>
        </div>
        <p class="text-[10px] mt-4 text-slate-500 italic">Nota: Asegúrate de que la hoja en Google Sheets se llame 'BASE' y esté publicada como CSV.</p>
    </div>

    <div id="tablero" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-20">
            <i class="fas fa-spinner animate-spin text-4xl text-indigo-500 mb-4"></i>
            <p class="text-slate-500 font-medium">Sincronizando con la base de datos de la OTIC...</p>
        </div>
    </div>

    <script>
        async function renderTablero() {
            const url = localStorage.getItem('dafp_otic_csv');
            if (!url) {
                document.getElementById('tablero').innerHTML = `
                    <div class="col-span-full bg-slate-800/50 border-2 border-dashed border-slate-700 rounded-3xl p-20 text-center">
                        <p class="text-slate-400 mb-4 font-medium">No hay una fuente de datos conectada.</p>
                        <button onclick="configurar()" class="text-indigo-400 font-bold hover:underline">Configurar enlace de Google Sheets</button>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(url);
                const data = await response.text();
                // Limpieza de filas (omitimos las 2 primeras filas de encabezados del Excel)
                const filas = data.split('\n').slice(2); 
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                filas.forEach(fila => {
                    const c = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (c.length < 10 || !c[2]) return;

                    // MAPEÓ BASADO EN TU EXCEL "BASE.CSV":
                    // c[1]: Mes, c[2]: Nombre, c[3]: Modalidad, c[4]: Presupuesto,
                    // c[6]: Responsable, c[7]: Fecha Límite Ficha, c[8]: Estado General,
                    // c[10]: Análisis Sector, c[11]: Estudios Previos, c[12]: Matriz Riesgo

                    const presupuesto = parseFloat(c[4]) || 0;
                    const estadoGral = c[8]?.trim();
                    const colorEstado = estadoGral === 'Atrasado' ? 'border-rose-500' : 
                                      estadoGral === 'En curso' ? 'border-indigo-500' : 'border-emerald-500';

                    const card = `
                        <div class="bg-slate-800 rounded-3xl border-b-8 ${colorEstado} p-6 shadow-2xl flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-4">
                                    <span class="bg-slate-900 text-indigo-400 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter border border-indigo-500/30">
                                        ${c[3]}
                                    </span>
                                    <span class="text-[10px] font-bold text-slate-500 italic">${c[1]}</span>
                                </div>

                                <h3 class="text-xl font-bold leading-tight mb-2 text-slate-100">${c[2]}</h3>
                                <p class="text-xs text-slate-400 mb-4 flex items-center gap-2">
                                    <i class="fas fa-user-tie text-indigo-400"></i> ${c[6] || 'Sin asignar'}
                                </p>

                                <div class="bg-slate-900/80 rounded-2xl p-4 mb-4 border border-slate-700/50">
                                    <p class="text-[10px] uppercase font-black text-slate-500 mb-1">Presupuesto Estimado</p>
                                    <p class="text-lg font-mono font-bold text-emerald-400">$${presupuesto.toLocaleString('es-CO')}</p>
                                </div>

                                <div class="space-y-2 mb-6">
                                    <div class="flex justify-between text-[11px]">
                                        <span class="text-slate-500">Estudios Previos:</span>
                                        <span class="font-bold ${c[11] === 'En curso' ? 'text-amber-400' : 'text-slate-300'}">${c[11]}</span>
                                    </div>
                                    <div class="flex justify-between text-[11px]">
                                        <span class="text-slate-500">Matriz de Riesgo:</span>
                                        <span class="font-bold ${c[12] === 'En curso' ? 'text-amber-400' : 'text-slate-300'}">${c[12]}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="pt-4 border-t border-slate-700 flex justify-between items-center">
                                <div>
                                    <p class="text-[9px] uppercase font-black text-slate-500">Límite Ficha</p>
                                    <p class="text-xs font-bold text-rose-400">${c[7] || '--'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] uppercase font-black text-slate-500">Estado</p>
                                    <p class="text-xs font-black ${estadoGral === 'Atrasado' ? 'text-rose-500' : 'text-emerald-400'} uppercase underline underline-offset-4">
                                        ${estadoGral}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Error cargando el tablero:", error);
            }
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            localStorage.setItem('dafp_otic_csv', document.getElementById('csvUrl').value);
            location.reload();
        }
        window.onload = renderTablero;
    </script>
</body>
</html>
