<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAFP - Seguimiento OTIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-300 min-h-screen pb-20">

    <header class="bg-[#1e293b] border-b border-slate-700 p-6 mb-8 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-white tracking-tighter">DAFP — OTIC 2026</h1>
                <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest">Gestión de Procesos</p>
            </div>
            <div class="flex gap-2">
                <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-lg">
                    <i class="fas fa-link"></i> VINCULAR DATOS
                </button>
            </div>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-7xl mx-auto mb-8 px-6">
        <div class="bg-slate-800 border border-indigo-500/50 p-6 rounded-2xl">
            <h2 class="text-white text-sm font-bold mb-4">Configurar URL de Google Sheets (CSV)</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="csvUrl" placeholder="Pega aquí el enlace que termina en &output=csv" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-indigo-100 outline-none">
                <button onclick="guardarConfig()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-xl font-black transition-all">CONECTAR</button>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tablero">
        <div class="col-span-full text-center py-20 text-slate-500 italic">
            <i class="fas fa-database mb-4 text-3xl block"></i>
            Haz clic en "Vincular Datos" y pega tu URL de Google Sheets para comenzar.
        </div>
    </main>

    <script>
        // Función para procesar CSV de forma segura
        function csvToArray(text) {
            const rows = text.split(/\r?\n/);
            return rows.map(row => {
                const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
            });
        }

        async function render() {
            const url = localStorage.getItem('dafp_otic_url');
            if (!url) return;

            try {
                const res = await fetch(url);
                const text = await res.text();
                const filas = text.split('\n').slice(2); // Salta título y encabezados
                
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                if (filas.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center">No se encontraron datos en la hoja.</p>';
                    return;
                }

                filas.forEach((fila, index) => {
                    // Limpieza simple por comas
                    const c = fila.split(',');
                    if (c.length < 5 || !c[2]) return;

                    const presupuesto = c[4] ? parseInt(c[4].replace(/\D/g,'')) : 0;
                    const estado = c[8] ? c[8].trim() : 'Sin estado';
                    const colorBorde = estado === 'Atrasado' ? 'border-rose-500' : 'border-indigo-500';

                    container.innerHTML += `
                        <div class="bg-[#1e293b] border-t-4 ${colorBorde} rounded-2xl p-6 shadow-xl flex flex-col justify-between min-h-[280px]">
                            <div>
                                <div class="flex justify-between mb-4">
                                    <span class="text-[9px] bg-slate-900 px-2 py-1 rounded text-indigo-400 font-black border border-indigo-500/20 uppercase">${c[3] || 'MODALIDAD'}</span>
                                    <span class="text-[10px] text-slate-500">${c[1] || ''}</span>
                                </div>
                                <h3 class="text-white font-bold text-base leading-tight mb-4 uppercase">${c[2]}</h3>
                                <div class="flex items-center gap-2 text-xs text-slate-400 mb-6">
                                    <i class="fas fa-user-circle text-slate-600"></i>
                                    <span>${c[6] || 'Responsable'}</span>
                                </div>
                                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 mb-2">
                                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Presupuesto</p>
                                    <p class="text-xl font-mono font-bold text-emerald-400">$${presupuesto.toLocaleString('es-CO')}</p>
                                </div>
                            </div>
                            <div class="pt-4 border-t border-slate-700/50 flex justify-between items-end">
                                <div>
                                    <p class="text-[9px] text-slate-500 font-bold uppercase">Estado</p>
                                    <p class="text-xs font-black ${estado === 'Atrasado' ? 'text-rose-500' : 'text-indigo-400'} uppercase">${estado}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] text-slate-500 font-bold uppercase">Ficha Límite</p>
                                    <p class="text-xs font-bold text-slate-300">${c[7] || '--'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('tablero').innerHTML = '<p class="col-span-full text-center text-rose-400">Error al cargar el CSV. Verifica que la URL sea correcta y esté publicada.</p>';
            }
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            const url = document.getElementById('csvUrl').value;
            localStorage.setItem('dafp_otic_url', url);
            location.reload();
        }
        window.onload = render;
    </script>
</body>
</html>
