<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC — Versión Original</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .critica { color: #f87171 !important; font-weight: 800; border-bottom: 2px solid #ef4444; }
        .advertencia { color: #fbbf24 !important; font-weight: 800; border-bottom: 2px solid #f59e0b; }
        .en-curso { color: #34d399 !important; font-weight: 800; }
        .pendiente { color: #94a3b8 !important; }
        .card-otic { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid #334155; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 p-4 md:p-8">

    <header class="max-w-[1400px] mx-auto mb-8 bg-slate-900/80 p-8 rounded-[2rem] border border-slate-800 shadow-2xl">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-3xl font-black text-white uppercase tracking-tighter italic">Seguimiento Contractual OTIC</h1>
                <p id="fechaActual" class="text-indigo-400 font-bold mt-1 uppercase text-[10px] tracking-widest"></p>
            </div>
            <div class="flex gap-4">
                <button onclick="document.getElementById('configPanel').classList.toggle('hidden')" class="bg-indigo-600 hover:bg-indigo-500 text-white w-14 h-14 rounded-2xl transition-all flex items-center justify-center shadow-lg">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-[1400px] mx-auto mb-8 bg-slate-800 p-6 rounded-2xl border border-indigo-500">
        <input type="text" id="csvUrl" placeholder="URL del CSV (Google Sheets)" class="w-full p-4 bg-slate-950 rounded-xl text-white outline-none mb-4 border border-slate-700">
        <button onclick="guardarConfig()" class="w-full bg-emerald-600 py-4 rounded-xl font-black uppercase text-white hover:bg-emerald-500 transition-all">Vincular Proyecto Único</button>
    </div>

    <main id="tablero" class="max-w-[1400px] mx-auto pb-24">
        </main>

    <script>
        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function getStatusInfo(fechaLim, estadoTexto) {
            if (!fechaLim || fechaLim === "" || fechaLim.toLowerCase().includes("fecha")) return { color: "pendiente" };
            const hoy = new Date();
            const limite = new Date(fechaLim);
            const diffDays = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0 || (estadoTexto && estadoTexto.toLowerCase().includes("atrasado"))) return { color: "critica" };
            if (diffDays <= 3) return { color: "advertencia" };
            return { color: "en-curso" };
        }

        async function render() {
            const url = localStorage.getItem('otic_v_original');
            if (!url) return;

            try {
                const res = await fetch(url);
                const csvText = await res.text();
                const sep = csvText.includes(';') ? ';' : ',';
                const filas = csvText.split(/\r?\n/).map(f => f.split(sep).map(c => c.trim().replace(/"/g, '')));
                
                // Buscamos el proyecto "Conectividad" o el primero que tenga datos
                // En el modelo original, el nombre está en la Fila 16, Columna B (índice 1)
                const filaNombre = 16; 
                const nombre = filas[filaNombre][1];
                const responsable = filas[filaNombre][7] || "No asignado";
                const modalidad = filas[filaNombre + 1][1];
                const presupuesto = filas[filaNombre + 2][1];

                // Actividades (Estados fila 23, Fechas fila 24)
                const estados = filas[23];
                const fechas = filas[24];

                const container = document.getElementById('tablero');
                container.innerHTML = `
                    <div class="card-otic rounded-[2.5rem] p-8 shadow-2xl">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 border-b border-slate-700/50 pb-8 uppercase italic">
                            <div><p class="text-[9px] font-black text-slate-500 mb-2">Proyecto</p><p class="text-white font-bold text-xs">${nombre}</p></div>
                            <div><p class="text-[9px] font-black text-slate-500 mb-2">Modalidad</p><p class="text-indigo-400 font-bold text-xs">${modalidad}</p></div>
                            <div><p class="text-[9px] font-black text-slate-500 mb-2">Presupuesto</p><p class="text-emerald-400 font-mono font-bold text-lg">${presupuesto}</p></div>
                            <div><p class="text-[9px] font-black text-slate-500 mb-2">Responsable Técnico</p><p class="text-slate-300 font-bold text-xs underline decoration-indigo-500/30">${responsable}</p></div>
                        </div>

                        <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                            ${etapa("Ficha Técnica", estados[1], fechas[1])}
                            ${etapa("SECOP II", estados[2], fechas[2])}
                            ${etapa("Análisis Sector", estados[3], fechas[3])}
                            ${etapa("Estudios Previos", estados[4], fechas[4])}
                            ${etapa("Matriz Riesgos", estados[5], fechas[5])}
                        </div>
                    </div>
                `;

            } catch (e) { console.error("Error:", e); }
        }

        function etapa(tit, est, fec) {
            const info = getStatusInfo(fec, est);
            return `<div class="bg-black/30 p-4 rounded-2xl border border-slate-800/50 text-center">
                <p class="text-[9px] font-black uppercase mb-1 ${info.color}">${tit}</p>
                <p class="text-[10px] font-bold text-white leading-tight mb-1">${est || '---'}</p>
                <p class="text-[9px] font-mono text-slate-600 italic">${fec || '--'}</p>
            </div>`;
        }

        function guardarConfig() {
            localStorage.setItem('otic_v_original', document.getElementById('csvUrl').value.trim());
            location.reload();
        }
        window.onload = render;
    </script>
</body>
</html>
