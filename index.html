<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC - DAFP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .critica { color: #ff4d4d; font-weight: 800; text-shadow: 0 0 5px rgba(255,77,77,0.3); }
        .advertencia { color: #ffb300; font-weight: 800; }
        .en-curso { color: #4ade80; font-weight: 800; }
        .pendiente { color: #94a3b8; font-weight: 800; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 font-sans p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto mb-6 bg-slate-900/50 border border-slate-800 p-8 rounded-[2rem] shadow-2xl">
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tighter uppercase leading-none">Tablero de Seguimiento Contractual</h1>
                <p id="fechaActual" class="text-indigo-400 font-bold mt-2 italic"></p>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <div class="bg-black/40 px-6 py-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] uppercase font-black text-slate-500 mb-1">Procesos</p>
                    <p id="totalProcesos" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-black/40 px-6 py-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] uppercase font-black text-slate-500 mb-1">Presupuesto Total</p>
                    <p id="totalPresupuesto" class="text-2xl font-black text-emerald-400">$0</p>
                </div>
                <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-14 h-14 rounded-2xl transition-all flex items-center justify-center shadow-lg">
                    <i class="fas fa-cog text-xl"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
            <div class="bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-rose-500 uppercase">Alertas Críticas (Vencidas)</p>
                <p id="countCriticas" class="text-2xl font-black text-rose-500">0</p>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-amber-500 uppercase">Advertencias (Próximos)</p>
                <p id="countAdvertencias" class="text-2xl font-black text-amber-500">0</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-emerald-400 uppercase">En Curso</p>
                <p id="countEnCurso" class="text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800/30 border border-slate-700/30 p-4 rounded-2xl text-slate-500">
                <p class="text-[10px] font-black uppercase">Pendientes</p>
                <p id="countPendientes" class="text-2xl font-black">0</p>
            </div>
        </div>
    </div>

    <div id="configPanel" class="hidden max-w-[1400px] mx-auto mb-6 bg-slate-800 p-6 rounded-2xl border border-indigo-500">
        <input type="text" id="csvUrl" placeholder="Pega el enlace CSV de Google Sheets" class="w-full p-4 bg-slate-950 rounded-xl text-white outline-none mb-4 border border-slate-700">
        <button onclick="guardarConfig()" class="w-full bg-indigo-600 py-4 rounded-xl font-black uppercase text-white hover:bg-indigo-500 transition-all">Sincronizar</button>
    </div>

    <main id="tablero" class="max-w-[1400px] mx-auto space-y-6">
        </main>

    <script>
        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function getStatusInfo(fechaLim, estadoTexto) {
            if (!fechaLim || fechaLim === "" || fechaLim === "--") return { color: "pendiente", alerta: false, advertencia: false };
            
            const hoy = new Date();
            const limite = new Date(fechaLim);
            const diffTime = limite - hoy;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0 || estadoTexto === "Atrasado") return { color: "critica", alerta: true, advertencia: false };
            if (diffDays <= 2) return { color: "advertencia", alerta: false, advertencia: true };
            if (estadoTexto === "En curso") return { color: "en-curso", alerta: false, advertencia: false };
            
            return { color: "pendiente", alerta: false, advertencia: false };
        }

        async function render() {
            const url = localStorage.getItem('otic_tablero_url');
            if (!url) return;

            try {
                const res = await fetch(url);
                const text = await res.text();
                const filas = text.split(/\r?\n/).slice(2);
                
                let stats = { totalP: 0, totalB: 0, criticas: 0, adv: 0, curso: 0, pend: 0 };
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                filas.forEach(fila => {
                    const c = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                    if (!c[2] || c[2].toLowerCase().includes("nombre")) return;

                    stats.totalP++;
                    const presupuesto = parseInt(c[4]?.replace(/[^0-9]/g, '')) || 0;
                    stats.totalB += presupuesto;

                    // Validaciones de fechas y estados para alertas
                    const sFicha = getStatusInfo(c[7], c[5]);
                    const sAnalisis = getStatusInfo(c[13], c[10]);
                    const sPrevios = getStatusInfo(c[13], c[11]);
                    const sRiesgos = getStatusInfo(c[13], c[12]);

                    const itemAlerts = [sFicha, sAnalisis, sPrevios, sRiesgos];
                    if (itemAlerts.some(a => a.alerta)) stats.criticas++;
                    else if (itemAlerts.some(a => a.advertencia)) stats.adv++;
                    else if (c[8] === "En curso") stats.curso++;
                    else stats.pend++;

                    container.innerHTML += `
                        <div class="bg-slate-900/80 border border-slate-800 rounded-[2.5rem] p-8 shadow-xl">
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 border-b border-slate-800 pb-8">
                                <div><p class="text-[10px] font-black text-slate-500 uppercase mb-2">Proceso</p><p class="text-white font-bold leading-tight uppercase text-sm">${c[2]}</p></div>
                                <div><p class="text-[10px] font-black text-slate-500 uppercase mb-2">Modalidad</p><p class="text-indigo-400 font-bold text-sm">${c[3]}</p></div>
                                <div><p class="text-[10px] font-black text-slate-500 uppercase mb-2">Presupuesto</p><p class="text-emerald-400 font-mono font-bold text-lg">$${presupuesto.toLocaleString('es-CO')}</p></div>
                                <div><p class="text-[10px] font-black text-slate-500 uppercase mb-2">Responsable</p><p class="text-slate-300 font-bold text-sm underline decoration-indigo-500/30">${c[6]}</p></div>
                            </div>

                            <div class="grid grid-cols-2 lg:grid-cols-7 gap-3">
                                ${crearEtapa("Ficha Técnica", c[5], c[7], sFicha.color)}
                                ${crearEtapa("Análisis Sector", c[10], c[13], sAnalisis.color)}
                                ${crearEtapa("Estudios Previos", c[11], c[13], sPrevios.color)}
                                ${crearEtapa("Matriz Riesgos", c[12], c[13], sRiesgos.color)}
                                ${crearEtapa("SECOP", c[14], c[15], "pendiente")}
                                ${crearEtapa("Evaluación", c[17], c[18], "pendiente")}
                                ${crearEtapa("Adjudicación", c[19], c[20], "pendiente")}
                            </div>
                        </div>
                    `;
                });

                document.getElementById('totalProcesos').innerText = stats.totalP;
                document.getElementById('totalPresupuesto').innerText = '$' + stats.totalB.toLocaleString('es-CO');
                document.getElementById('countCriticas').innerText = stats.criticas;
                document.getElementById('countAdvertencias').innerText = stats.adv;
                document.getElementById('countEnCurso').innerText = stats.curso;
                document.getElementById('countPendientes').innerText = stats.pend;

            } catch (e) { console.error("Error cargando tablero:", e); }
        }

        function crearEtapa(titulo, estado, fecha, colorClase) {
            return `
                <div class="bg-black/30 p-4 rounded-2xl border border-slate-800/50 text-center">
                    <p class="text-[9px] font-black uppercase mb-2 ${colorClase}">${titulo}</p>
                    <p class="text-[11px] font-bold text-white leading-none mb-2">${estado || 'Sin iniciar'}</p>
                    <p class="text-[10px] font-mono text-slate-600">${fecha || '--'}</p>
                </div>
            `;
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            localStorage.setItem('otic_tablero_url', document.getElementById('csvUrl').value.trim());
            location.reload();
        }
        window.onload = render;
    </script>
</body>
</html>
