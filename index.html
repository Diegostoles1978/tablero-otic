<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Estratégico OTIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-10">

    <header class="bg-slate-900 border-b border-slate-800 p-6 mb-8 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-white italic underline decoration-indigo-500">DAFP — OTIC 2026</h1>
            <button onclick="configurar()" class="bg-indigo-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-500 transition-all">
                <i class="fas fa-cog mr-2"></i>CONFIGURAR DATOS
            </button>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-4xl mx-auto mb-8 px-6">
        <div class="bg-slate-900 border border-indigo-500/50 p-6 rounded-2xl shadow-2xl text-center">
            <p class="text-xs mb-4 text-indigo-300 font-bold uppercase tracking-widest">Enlace de Google Sheets (Publicado como CSV)</p>
            <input type="text" id="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv" 
                   class="w-full bg-black border border-slate-700 rounded-xl p-3 text-sm text-white mb-4 outline-none focus:border-indigo-500">
            <button onclick="guardarConfig()" class="bg-emerald-600 w-full py-3 rounded-xl font-black text-sm uppercase tracking-widest hover:bg-emerald-500 transition-all">Conectar Tablero</button>
        </div>
    </div>

    <main id="tablero" class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </main>

    <script>
        // Función avanzada para procesar CSV con encabezados dinámicos
        function csvToJSON(csv) {
            const lines = csv.split(/\r?\n/);
            // Buscamos la fila que contiene los encabezados reales (usualmente la fila 2 en tu archivo)
            let headerIndex = lines.findIndex(l => l.toLowerCase().includes('nombre del proceso') || l.toLowerCase().includes('presupuesto'));
            if (headerIndex === -1) headerIndex = 1; // Fallback

            const headers = lines[headerIndex].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/"/g, '').trim().toLowerCase());
            
            return lines.slice(headerIndex + 1).map(line => {
                const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const obj = {};
                headers.forEach((header, i) => {
                    obj[header] = values[i] ? values[i].replace(/"/g, '').trim() : '';
                });
                return obj;
            });
        }

        async function cargarTablero() {
            const url = localStorage.getItem('dafp_otic_csv');
            if (!url) return;

            try {
                const res = await fetch(url);
                const data = await res.text();
                const json = csvToJSON(data);
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                json.forEach(item => {
                    // Mapeo inteligente buscando palabras clave en los encabezados
                    const nombre = item['nombre del proceso'] || item['nombre'] || 'Proceso sin nombre';
                    const modalidad = item['modalidad de contratación'] || item['modalidad'] || 'Por definir';
                    const mes = item['mes del proceso'] || item['mes'] || '';
                    const responsable = item['responsable tecnico'] || item['responsable'] || 'No asignado';
                    const presupuestoRaw = item['presupuesto'] || '0';
                    const presupuesto = parseInt(presupuestoRaw.replace(/[^0-9]/g, '')) || 0;
                    const estado = item['estado general del proceso'] || item['estado'] || 'Pendiente';
                    const ficha = item['fecha límite entrega ficha(aaaa-mm-dd)'] || item['fecha límite'] || '--';

                    if (!nombre || nombre === 'Proceso sin nombre') return;

                    const colorBorde = estado.toLowerCase().includes('atrasado') ? 'border-rose-500 shadow-rose-900/20' : 'border-indigo-500';

                    container.innerHTML += `
                        <div class="bg-slate-900 border-t-4 ${colorBorde} rounded-2xl p-6 shadow-xl flex flex-col justify-between hover:scale-[1.02] transition-all">
                            <div>
                                <div class="flex justify-between items-start mb-4">
                                    <span class="text-[9px] font-black bg-slate-800 text-indigo-400 px-2 py-1 rounded border border-indigo-500/20 uppercase tracking-tighter italic">${modalidad}</span>
                                    <span class="text-[10px] text-slate-500 font-bold italic">${mes}</span>
                                </div>
                                <h3 class="text-white font-bold text-sm leading-tight mb-4 uppercase tracking-tight h-10 line-clamp-2">${nombre}</h3>
                                <div class="flex items-center gap-2 text-xs text-slate-400 mb-6 border-b border-slate-800 pb-4 italic">
                                    <i class="fas fa-user-circle text-indigo-500/50"></i>
                                    <span>${responsable}</span>
                                </div>
                                <div class="bg-black/30 p-4 rounded-xl border border-slate-800/50 mb-2">
                                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Presupuesto Estimado</p>
                                    <p class="text-lg font-mono font-bold text-emerald-400 leading-none">$${presupuesto.toLocaleString('es-CO')}</p>
                                </div>
                            </div>
                            <div class="pt-4 mt-4 border-t border-slate-800 flex justify-between items-end">
                                <div>
                                    <p class="text-[9px] text-slate-500 font-black uppercase mb-0.5 tracking-tighter">Estado General</p>
                                    <p class="text-[11px] font-black ${estado.toLowerCase().includes('atrasado') ? 'text-rose-500' : 'text-indigo-400'} uppercase underline underline-offset-4">${estado}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] text-slate-500 font-black uppercase mb-0.5 tracking-tighter">Límite Ficha</p>
                                    <p class="text-[11px] font-bold text-slate-300 italic">${ficha}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error cargando el tablero dinámico", e);
            }
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            const url = document.getElementById('csvUrl').value.trim();
            if(url) {
                localStorage.setItem('dafp_otic_csv', url);
                location.reload();
            }
        }
        window.onload = cargarTablero;
    </script>
</body>
</html>
