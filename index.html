<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>OTIC</title>https://cdn.tailwindcss.com</head>

<body class="bg-slate-900 text-white p-6">

<div class="max-w-3xl mx-auto">

<h1 class="text-2xl font-bold mb-4">📊 Proyecto (Fijo)</h1>

<button onclick="load()" class="bg-indigo-600 px-4 py-2 rounded mb-4">
Cargar datos
</button>

<div id="card"></div>

</div>

<script>

async function load(){

    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZSnc6zf2k6ICNeut_QXegHFOWtDdiSX_LY4qg1LqP4z3iYNUwcXMdgNaZODcy8Q/pub?output=csv";

    const res = await fetch(url + "&t=" + new Date().getTime());
    const csv = await res.text();

    // dividir filas correctamente
    const rows = csv.split(/\r?\n/).map(r => r.split(","));

    // ✅ fila 3 = índice 2
    const r = rows[2];

    // ✅ columnas FIJAS según tu Excel
    const nombre = r[2];       // C
    const modalidad = r[3];    // D
    const presupuesto = parseFloat(r[4]) || 0; // E
    const ficha = r[5];        // F
    const responsable = r[6];  // G
    const estado = r[8];       // I

    document.getElementById("card").innerHTML = `
    <div class="bg-slate-800 p-6 rounded-xl">

        <h2 class="text-xl font-bold mb-2">${nombre}</h2>

        <p class="text-sm">👤 ${responsable}</p>
        <p class="text-sm">📄 ${modalidad}</p>

        <p class="text-emerald-400 font-mono mb-4">
            💰 $${presupuesto.toLocaleString('es-CO')}
        </p>

        <p class="mb-2">
            📌 Ficha técnica: <b>${ficha}</b>
        </p>

        <p class="bg-indigo-600 inline-block px-3 py-1 rounded text-xs">
            Estado: ${estado}
        </p>

    </div>`;
}

</script>

</body></html>
