<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Tablero OTIC</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-white p-6"><div class="max-w-6xl mx-auto"><h1 class="text-3xl font-bold mb-6">📊 Seguimiento Contractual</h1><input id="url" placeholder="Pega URL CSV" class="w-full p-3 text-black rounded mb-4"><button onclick="load()" class="bg-indigo-600 px-4 py-2 rounded">Conectar</button><div id="board" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6"></div></div><script>async function load(){const url=document.getElementById("url").value;if(!url)return alert("Pega URL");localStorage.setItem("csv",url);render()}function cls(e){e=e.toLowerCase();if(e.includes("completado"))return"bg-green-500";if(e.includes("atrasado"))return"bg-red-500";if(e.includes("en curso"))return"bg-yellow-500";return"bg-gray-500"}async function render(){const url=localStorage.getItem("csv");if(!url)return;const res=await fetch(url);const csv=await res.text();const sep=csv.split("\n")[2].includes(";")?";":",";const rows=csv.split(/\r?\n/).map(r=>r.split(sep).map(c=>c.replace(/"/g,"").trim()));let html="";for(let i=2;i<rows.length;i++){let r=rows[i];if(!r[2]||r[2].length<3)continue;let nombre=r[2],modalidad=r[3],presupuesto=parseInt((r[4]||"").replace(/[^0-9]/g,''))||0,responsable=r[6],estado=r[8];html+=`<div class="bg-slate-800 p-6 rounded-xl shadow"><h2 class="text-xl font-bold mb-2">${nombre}</h2><p class="text-sm mb-1">👤 ${responsable}</p><p class="text-sm mb-1">📄 ${modalidad}</p><p class="text-emerald-400 font-mono mb-3">$${presupuesto.toLocaleString('es-CO')}</p><div class="space-y-2 text-sm"><div class="flex justify-between"><span>Ficha técnica</span><span class="px-2 rounded ${cls(r[5]||'')}">${r[5]||'-'}</span></div><div class="flex justify-between"><span>Análisis sector</span><span class="px-2 rounded ${cls(r[10]||'')}">${r[10]||'-'}</span></div><div class="flex justify-between"><span>Estudios previos</span><span class="px-2 rounded ${cls(r[11]||'')}">${r[11]||'-'}</span></div><div class="flex justify-between"><span>Matriz riesgo</span><span class="px-2 rounded ${cls(r[12]||'')}">${r[12]||'-'}</span></div><div class="flex justify-between"><span>Evaluación</span><span class="px-2 rounded ${cls(r[18]||'')}">${r[18]||'-'}</span></div><div class="flex justify-between"><span>Adjudicación</span><span class="px-2 rounded ${cls(r[20]||'')}">${r[20]||'-'}</span></div></div></div>`}document.getElementById("board").innerHTML=html}window.onload=render</script></body></html>
