<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC — Gestión Contractual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .critica { color: #ff4444 !important; font-weight: 800; border-bottom: 2px solid #ff4444; }
        .advertencia { color: #fbbf24 !important; font-weight: 800; border-bottom: 2px solid #fbbf24; }
        .en-curso { color: #34d399 !important; font-weight: 800; }
        .pendiente { color: #64748b !important; }
        .card-otic { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid #334155; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 p-4 md:p-8">

    <header class="max-w-[1400px] mx-auto mb-8 bg-slate-900/80 p-8 rounded-[2rem] border border-slate-800 shadow-2xl">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-3xl font-black text-white uppercase tracking-tighter italic">Tablero de Seguimiento Contractual</h1>
                <p id="fechaActual" class="text-indigo-400 font-bold mt-1 uppercase text-xs tracking-widest"></p>
            </div>
            <div class="flex gap-4">
                <div class="bg-black/40 px-6 py-4 rounded-2xl border border-slate-800 text-center">
                    <p class="text-[10px] font-black text-slate-500 uppercase mb-1 italic">Presupuesto Ejecución</p>
                    <p id="totalPresupuesto" class="text-2xl font-black text-emerald-400">$0</p>
                </div>
                <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-14 h-14 rounded-2xl transition-all flex items-center justify-center shadow-lg">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
            <div class="bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl text-center">
                <p class="text-[10px] font-black text-rose-500 uppercase italic">Alertas Críticas</p>
                <p id="countCriticas" class="text-2xl font-black text-rose-500">0</p>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-2xl text-center">
                <p class="text-[10px] font-black text-amber-500 uppercase italic">Advertencias</p>
                <p id="countAdvertencias" class="text-2xl font-black text-amber-500">0</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl text-center">
                <p class="text-[10px] font-black text-emerald-400 uppercase italic">En Curso</p>
                <p id="countEnCurso" class="text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800/30 border border-slate-700/30 p-4 rounded-2xl text-center">
                <p class="text-[10px] font-black text-slate-500 uppercase italic">Pendientes</p>
                <p id="countPendientes" class="text-2xl font-black text-slate-500">0</p>
            </div>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-[1400px] mx-auto mb-8 bg-slate-800 p-6 rounded-2xl border border-indigo-500">
        <input type="text" id="csvUrl" placeholder="URL del CSV de Google Sheets" class="w-full p-4 bg-slate-950 rounded-xl text-white outline-none mb-4 border border-slate-700">
        <button onclick="guardarConfig()" class="w-full bg-emerald-600 py-4 rounded-xl font-black uppercase text-white">Actualizar</button>
    </div>

    <main id="tablero" class="max-w-[1400px] mx-auto space-y-12 pb-24"></main>

    <script>
        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function getStatusInfo(fechaLim, estadoTexto) {
            if (!fechaLim || fechaLim === "" || fechaLim.includes("Fecha")) return { color: "pendiente", crit: 0, adv: 0 };
            const hoy = new Date();
            const limite = new Date(fechaLim);
            const diffDays = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 || estadoTexto === "Atrasado") return { color: "critica", crit: 1, adv: 0 };
            if (diffDays <= 2) return { color: "advertencia", crit: 0, adv: 1 };
            return { color: "en-curso", crit: 0, adv: 0 };
        }

        async function render() {
            const url = localStorage.getItem('otic_v7_final');
            if (!url) return;

            try {
                const res = await fetch(url);
                const csvData = await res.text();
                const filas = csvData.split(/\r?\n/).map(f => f.split(',').map(c => c.trim().replace(/"/g, '')));
                
                let stats = { totalB: 0, crit: 0, adv: 0, curso: 0, pend: 0 };
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                // El archivo tiene bloques cada ~10 filas. Escaneamos para encontrar el inicio de cada proyecto.
                for (let i = 0; i < filas.length; i++) {
                    if (filas[i][1] && filas[i][1].includes("DAFP")) {
                        const nombreProceso = filas[i][1];
                        const modalidad = filas[i+1][1] || "No definida";
                        const responsableRaw = filas[i][7] || "";
                        const responsable = responsableRaw.split(":")[1]?.trim() || "No asignado";
                        
                        // Limpieza presupuesto
                        const pRaw = filas[i+2][1]?.replace(/[^0-9]/g, '') || "0";
                        const presupuesto = parseInt(pRaw);
                        stats.totalB += presupuesto;

                        // Mapeo por coordenadas relativas al bloque
                        const sFicha = getStatusInfo(filas[i+8][2], filas[i+7][2]);
                        const sAnalisis = getStatusInfo(filas[i+8][4], filas[i+7][4]);
                        const sPrevios = getStatusInfo(filas[i+8][5], filas[i+7][5]);
                        const sRiesgos = getStatusInfo(filas[i+8][6], filas[i+7][6]);

                        if (sFicha.crit || sAnalisis.crit) stats.crit++;
                        else if (sFicha.adv || sAnalisis.adv) stats.adv++;
                        else stats.curso++;

                        container.innerHTML += `
                            <div class="card-otic rounded-[2.5rem] p-8 shadow-2xl">
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 border-b border-slate-700/50 pb-8 uppercase text-[10px]">
                                    <div><p class="text-slate-500 mb-1 font-black">Proceso</p><p class="text-white font-bold text-sm leading-tight italic">${nombreProceso}</p></div>
                                    <div><p class="text-slate-500 mb-1 font-black">Modalidad</p><p class="text-indigo-400 font-bold">${modalidad}</p></div>
                                    <div><p class="text-slate-500 mb-1 font-black">Presupuesto</p><p class="text-emerald-400 font-mono font-bold text-lg">$${presupuesto.toLocaleString('es-CO')}</p></div>
                                    <div><p class="text-slate-500 mb-1 font-black">Responsable Ficha Técnica</p><p class="text-slate-300 font-bold">${responsable}</p></div>
                                </div>

                                <div class="grid grid-cols-2 lg:grid-cols-7 gap-3">
                                    ${etapa("Ficha Técnica", filas[i+7][2], filas[i+8][2], sFicha.color)}
                                    ${etapa("Análisis Sector", filas[i+7][4], filas[i+8][4], sAnalisis.color)}
                                    ${etapa("Estudios Previos", filas[i+7][5], filas[i+8][5], sPrevios.color)}
                                    ${etapa("Matriz Riesgos", filas[i+7][6], filas[i+8][6], sRiesgos.color)}
                                    
                                    <div class="bg-indigo-900/20 p-4 rounded-2xl border border-indigo-500/30 text-center">
                                        <p class="text-[9px] font-black uppercase mb-2 text-indigo-400 italic">SECOP II / Detalle</p>
                                        <div class="text-[9px] text-slate-400 space-y-0.5 font-medium">
                                            <p><span class="text-slate-600">RAD:</span> ${filas[i+22] ? filas[i+22][18] : '--'}</p>
                                            <p><span class="text-slate-600">PROCESO:</span> ${filas[i+22] ? filas[i+22][21] : '--'}</p>
                                        </div>
                                    </div>

                                    ${etapa("Evaluación", filas[i+7][7], filas[i+8][7], "pendiente")}
                                    ${etapa("Adjudicación", filas[i+7][8], filas[i+8][8], "pendiente")}
                                </div>
                            </div>
                        `;
                    }
                }

                document.getElementById('totalPresupuesto').innerText = '$' + stats.totalB.toLocaleString('es-CO');
                document.getElementById('countCriticas').innerText = stats.crit;
                document.getElementById('countAdvertencias').innerText = stats.adv;
                document.getElementById('countEnCurso').innerText = stats.curso;
                document.getElementById('countPendientes').innerText = stats.pend;

            } catch (e) { console.error("Error cargando bloques:", e); }
        }

        function etapa(tit, est, fec, col) {
            return `<div class="bg-black/30 p-4 rounded-2xl border border-slate-800/50 text-center">
                <p class="text-[9px] font-black uppercase mb-1 ${col}">${tit}</p>
                <p class="text-[10px] font-bold text-white leading-tight mb-1">${est || '---'}</p>
                <p class="text-[9px] font-mono text-slate-600 italic">${fec || '--'}</p>
            </div>`;
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            localStorage.setItem('otic_v7_final', document.getElementById('csvUrl').value.trim());
            location.reload();
        }
        window.onload = render;
    </script>
</body>
</html>
