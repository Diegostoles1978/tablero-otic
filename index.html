<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento OTIC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-10">

    <header class="bg-slate-900 border-b border-slate-800 p-6 mb-8 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-white tracking-tighter">DAFP — OTIC 2026</h1>
                <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-[0.2em]">Gestión Contractual Estratégica</p>
            </div>
            <div class="flex gap-2">
                <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fas fa-database"></i> Vincular CSV
                </button>
            </div>
        </div>
    </header>

    <div id="configPanel" class="hidden max-w-7xl mx-auto mb-8 px-6">
        <div class="bg-slate-900 border border-indigo-500/50 p-4 rounded-xl">
            <input type="text" id="csvUrl" placeholder="Pega el enlace finalizado en &output=csv" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-indigo-100 outline-none focus:border-indigo-500">
            <button onclick="guardarConfig()" class="mt-3 w-full bg-indigo-600 py-2 rounded-lg font-bold text-sm">Actualizar Conexión</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tablero">
        </main>

    <script>
        // Función especial para leer CSV con comas internas
        function parseCSVLine(text) {
            const result = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) {
                    result.push(cur.trim());
                    cur = '';
                } else cur += char;
            }
            result.push(cur.trim());
            return result;
        }

        async function render() {
            const url = localStorage.getItem('dafp_otic_url');
            if (!url) return;

            try {
                const res = await fetch(url);
                const text = await res.text();
                // Saltamos las 2 primeras filas (Título y Encabezados)
                const filas = text.split(/\r?\n/).slice(2); 
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                filas.forEach(fila => {
                    const c = parseCSVLine(fila);
                    if (c.length < 10 || !c[2]) return;

                    // MAPEÓ EXACTO SEGÚN TU ARCHIVO:
                    // c[1]: Mes, c[2]: Nombre, c[3]: Modalidad, c[4]: Presupuesto,
                    // c[6]: Responsable, c[7]: Fecha Límite, c[8]: Estado General
                    
                    const valor = parseInt(c[4]) || 0;
                    const estado = c[8] || 'Pendiente';
                    const colorClase = estado === 'Atrasado' ? 'border-rose-500 bg-rose-500/5' : 'border-indigo-500 bg-slate-900';

                    container.innerHTML += `
                        <div class="border-l-4 ${colorClase} p-5 rounded-r-2xl shadow-lg flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-[9px] font-black px-2 py-0.5 bg-slate-800 text-indigo-400 rounded uppercase tracking-widest">${c[3]}</span>
                                    <span class="text-[10px] text-slate-500 font-bold">${c[1]}</span>
                                </div>
                                <h3 class="text-white font-bold text-sm leading-snug mb-4 uppercase">${c[2]}</h3>
                                
                                <div class="flex items-center gap-2 text-[11px] text-slate-400 mb-4">
                                    <i class="fas fa-user-circle"></i>
                                    <span>${c[6]}</span>
                                </div>

                                <div class="bg-black/20 p-3 rounded-lg border border-slate-800 mb-4">
                                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Presupuesto Estimado</p>
                                    <p class="text-base font-mono font-bold text-emerald-400">$${valor.toLocaleString('es-CO')}</p>
                                </div>
                            </div>

                            <div class="pt-3 border-t border-slate-800 flex justify-between items-end">
                                <div>
                                    <p class="text-[9px] text-slate-600 font-bold uppercase italic">Estado Actual</p>
                                    <p class="text-[11px] font-black ${estado === 'Atrasado' ? 'text-rose-500' : 'text-indigo-400'} uppercase">${estado}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] text-slate-600 font-bold uppercase">Entrega Ficha</p>
                                    <p class="text-[11px] font-bold text-slate-300">${c[7]}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        function configurar() { document.getElementById('configPanel').classList.toggle('hidden'); }
        function guardarConfig() {
            localStorage.setItem('dafp_otic_url', document.getElementById('csvUrl').value);
            location.reload();
        }
        window.onload = render;
    </script>
</body>
</html>
