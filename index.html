<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablero OTIC — Control de Procesos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .card-otic { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid #334155; transition: all 0.3s ease; }
        .card-otic:hover { border-color: #6366f1; transform: translateY(-5px); }
        .atrasado { border-top: 5px solid #ef4444; }
        .completado { border-top: 5px solid #10b981; }
        .en-curso { border-top: 5px solid #f59e0b; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 p-6 font-sans">

    <div class="max-w-[1400px] mx-auto">
        <header class="flex flex-col md:row justify-between items-center mb-10 bg-slate-900/80 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black text-white italic uppercase tracking-tighter">Seguimiento Contractual</h1>
                <p class="text-indigo-400 text-[10px] font-bold uppercase mt-1 tracking-[0.3em]">Oficina de Tecnologías de la Información</p>
            </div>
            <div class="flex items-center gap-6 mt-4 md:mt-0">
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Presupuesto Total (E)</p>
                    <p id="totalGlobal" class="text-3xl font-black text-emerald-400 font-mono">$0</p>
                </div>
                <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="bg-indigo-600 hover:bg-indigo-500 p-4 rounded-2xl text-white transition-all">
                    <i class="fas fa-database"></i>
                </button>
            </div>
        </header>

        <div id="setup" class="hidden mb-8 bg-slate-800/40 p-6 rounded-2xl border border-indigo-500/30">
            <input type="text" id="urlInput" placeholder="Pega la URL del CSV (Hoja BASE)" class="w-full p-4 bg-black/50 rounded-xl text-white border border-slate-700 outline-none mb-4">
            <button onclick="saveUrl()" class="w-full bg-indigo-600 py-4 rounded-xl font-black text-white uppercase tracking-widest">Sincronizar Datos</button>
        </div>

        <div id="tablero" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </div>

    <script>
        async function update() {
            const url = localStorage.getItem('otic_v16_final');
            if (!url) { document.getElementById('setup').classList.remove('hidden'); return; }

            try {
                const res = await fetch(url);
                const csv = await res.text();
                const sep = csv.includes(';') ? ';' : ',';
                const rows = csv.split(/\r?\n/).map(r => r.split(sep).map(c => c.trim().replace(/"/g, '')));
                
                const container = document.getElementById('tablero');
                container.innerHTML = '';
                let grandTotal = 0;

                // Empezamos en i=2 (Fila 3 del Excel)
                for (let i = 2; i < rows.length; i++) {
                    const data = rows[i];
                    
                    // Validamos que exista un nombre de proceso en la columna C (índice 2)
                    // Y que la columna B (Mes) no esté vacía para evitar leer notas sueltas
                    if (!data[2] || data[2] === "" || data[2].length < 3 || !data[1]) continue;

                    const nombre = data[2];
                    const modalidad = data[3] || "N/A";
                    const presupuesto = parseInt(data[4]) || 0; // Columna E (Índice 4)
                    const responsableTecnico = data[6] || "Por asignar"; // Columna G (Índice 6)
                    const estadoGral = data[8] || "Sin iniciar";
                    const obs = data[27] || ""; // Columna AB (Observaciones)

                    grandTotal += presupuesto;

                    let statusClass = "en-curso";
                    if (estadoGral.toLowerCase().includes("atrasado")) statusClass = "atrasado";
                    if (estadoGral.toLowerCase().includes("completado")) statusClass = "completado";

                    container.innerHTML += `
                        <div class="card-otic rounded-[2.5rem] p-7 shadow-2xl ${statusClass}">
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-slate-800 text-indigo-400 px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-tighter">${modalidad}</span>
                                <span class="text-[10px] font-bold text-slate-500 uppercase">${data[1]}</span>
                            </div>
                            
                            <h3 class="text-white font-bold text-sm mb-6 h-12 overflow-hidden uppercase italic leading-tight">${nombre}</h3>

                            <div class="space-y-4 mb-6">
                                <div class="flex justify-between items-end border-b border-slate-800 pb-2">
                                    <div>
                                        <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Presupuesto</p>
                                        <p class="text-xl font-black text-emerald-400 font-mono">$${presupuesto.toLocaleString('es-CO')}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Responsable Técnico</p>
                                        <p class="text-slate-300 text-[10px] font-bold italic">${responsableTecnico}</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-black/20 p-4 rounded-2xl border border-slate-800/50">
                                <p class="text-[9px] text-indigo-500 font-black uppercase mb-3 tracking-widest text
