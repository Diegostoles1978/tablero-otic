<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC - DAFP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .critica { color: #ff4d4d !important; font-weight: 800; }
        .advertencia { color: #ffb300 !important; font-weight: 800; }
        .en-curso { color: #4ade80 !important; font-weight: 800; }
        .pendiente { color: #64748b !important; font-weight: 800; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 font-sans p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto mb-6 bg-slate-900/50 border border-slate-800 p-8 rounded-[2rem] shadow-2xl">
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tighter uppercase leading-none">Tablero de Seguimiento Contractual</h1>
                <p id="fechaActual" class="text-indigo-400 font-bold mt-2 italic"></p>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <div class="bg-black/40 px-6 py-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] uppercase font-black text-slate-500 mb-1">Procesos</p>
                    <p id="totalProcesos" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-black/40 px-6 py-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] uppercase font-black text-slate-500 mb-1">Presupuesto Total</p>
                    <p id="totalPresupuesto" class="text-2xl font-black text-emerald-400">$0</p>
                </div>
                <button onclick="configurar()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-14 h-14 rounded-2xl transition-all flex items-center justify-center shadow-lg">
                    <i class="fas fa-cog text-xl"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
            <div class="bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-rose-500 uppercase italic">Alertas Críticas</p>
                <p id="countCriticas" class="text-2xl font-black text-rose-500">0</p>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-amber-500 uppercase italic">Advertencias</p>
                <p id="countAdvertencias" class="text-2xl font-black text-amber-500">0</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-emerald-400 uppercase italic">En Curso</p>
                <p id="countEnCurso" class="text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="bg-slate-800/30 border border-slate-700/30 p-4 rounded-2xl">
                <p class="text-[10px] font-black text-slate-500 uppercase italic">Pendientes</p>
                <p id="countPendientes" class="text-2xl font-black text-slate-500">0</p>
            </div>
        </div>
    </div>

    <div id="configPanel" class="hidden max-w-[1400px] mx-auto mb-6 bg-slate-800 p-6 rounded-2xl border border-indigo-500">
        <input type="text" id="csvUrl" placeholder="Pega el enlace CSV de Google Sheets" class="w-full p-4 bg-slate-950 rounded-xl text-white outline-none mb-4 border border-slate-700">
        <button onclick="guardarConfig()" class="w-full bg-indigo-600 py-4 rounded-xl font-black uppercase text-white">Sincronizar Datos</button>
    </div>

    <main id="tablero" class="max-w-[1400px] mx-auto space-y-6">
        </main>

    <script>
        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function getStatusInfo(fechaLim, estadoTexto) {
            if (!fechaLim || fechaLim === "" || fechaLim === "--") return { color: "pendiente", crit: 0, adv: 0 };
            
            const hoy = new Date();
            const limite = new Date(fechaLim);
            const diffDays = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));

            if (diffDays < 0 || estadoTexto === "Atrasado") return { color: "critica", crit: 1, adv: 0 };
            if (diffDays <= 2) return { color: "advertencia", crit: 0, adv: 1 };
            if (estadoTexto === "En curso") return { color: "en-curso", crit: 0, adv: 0 };
            return { color: "pendiente", crit: 0, adv: 0 };
        }

        async function render() {
            const url = localStorage.getItem('otic_vfinal_url');
            if (!url) return;

            try {
                const res = await fetch(url);
                const text = await res.text();
                const filas = text.split(/\r?\n/);
                
                let stats = { totalP: 0, totalB: 0, criticas: 0, adv: 0, curso: 0, pend: 0 };
                const container = document.getElementById('tablero');
                container.innerHTML = '';

                filas.forEach((fila, index) => {
                    // El procesamiento real comienza después de los encabezados (Fila 3 en adelante)
                    if (index < 2) return; 

                    const c = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                    
                    // VALIDACIÓN CRÍTICA: Solo procesar si hay presupuesto y nombre
                    if (!c[2] || c[2] === "" || isNaN(parseInt(c[4]?.replace(/[^0-9]/g, '')))) return;

                    stats.totalP++;
                    const presupuesto = parseInt(c[4].replace(/[^0-9]/g, '')) || 0;
                    stats.totalB += presupuesto;

                    // Mapeo según archivo BASE: Ficha(7,5), Análisis/Estudios/Riesgo(13, 10/11/12), SECOP(15,14)
                    const sFicha = getStatusInfo(c[7], c[5]);
                    const sAnalis = getStatusInfo(c[13], c[10]);
                    const sEstud = getStatusInfo(c[13], c[11]);
                    const sRiesg = getStatusInfo(c[13], c[12]);

                    // Actualizar contadores globales
                    if (sFicha.crit || sAnalis.crit || sEstud.crit || sRiesg.crit) stats.criticas++;
                    else if (sFicha.adv || sAnalis
