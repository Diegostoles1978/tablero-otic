<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Dashboard OTIC</title><script src="https://cdn.tailwindcss.com"></script><body class="bg-slate-900 text-white p-6"><div class="max-w-6xl mx-auto"><h1 class="text-3xl font-bold mb-6">📊 Tablero OTIC</h1><input id="url" placeholder="Pega URL CSV" class="w-full p-3 text-black rounded mb-4"><button onclick="load()" class="bg-indigo-600 px-4 py-2 rounded">Conectar</button><div id="kpi" class="flex gap-4 mt-6"></div><div id="board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></div></div><script>async function load(){const url=document.getElementById("url").value;if(!url){alert("Pega una URL");return;}localStorage.setItem("csv",url);render();}async function render(){const url=localStorage.getItem("csv");if(!url)return;try{const res=await fetch(url);const csv=await res.text();const sep=csv.split("\n")[2].includes(";")?";":",";const rows=csv.split(/\r?\n/).map(r=>r.split(sep).map(c=>c.replace(/"/g,"").trim()));let total=0,enCurso=0,atrasado=0,completado=0,html="";for(let i=2;i<rows.length;i++){const r=rows[i];if(!r[2]||r[2].length<3)continue;const nombre=r[2],modalidad=r[3]||"N/A",presupuesto=parseInt((r[4]||"").replace(/[^0-9]/g,""))||0,estado=r[8]||"Sin iniciar";total+=presupuesto;let color="bg-yellow-500";if(estado.toLowerCase().includes("atrasado")){color="bg-red-500";atrasado++;}else if(estado.toLowerCase().includes("completado")){color="bg-green-500";completado++;}else{enCurso++;}html+=`<div class="bg-slate-800 p-5 rounded-xl shadow"><div class="flex justify-between mb-2"><span class="text-xs text-indigo-400">${modalidad}</span><span class="text-xs text-gray-400">${r[1]}</span></div><h3 class="font-bold mb-3">${nombre}</h3><p class="text-emerald-400 font-mono mb-2">$${presupuesto.toLocaleString()}</p><span class="px-2 py-1 text-xs rounded ${color}">${estado}</span></div>`;}document.getElementById("board").innerHTML=html;document.getElementById("kpi").innerHTML=`<div class="bg-slate-800 p-4 rounded">💰 $${total.toLocaleString()}</div><div class="bg-slate-800 p-4 rounded">🟡 ${enCurso}</div><div class="bg-slate-800 p-4 rounded">🔴 ${atrasado}</div><div class="bg-slate-800 p-4 rounded">🟢 ${completado}</div>`;}catch(e){alert("Error cargando datos");console.error(e);}}window.onload=render;</script></body></html>
