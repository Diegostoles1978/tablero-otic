<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablero OTIC — Control Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .card-otic { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid #334155; }
        .atrasado { border-top: 5px solid #ef4444; }
        .completado { border-top: 5px solid #10b981; }
        .en-curso { border-top: 5px solid #f59e0b; }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 p-6 font-sans">

    <div class="max-w-[1400px] mx-auto">
        <header class="flex justify-between items-center mb-10 bg-slate-900/80 p-8 rounded-[2.5rem] border border-slate-800">
            <div>
                <h1 class="text-3xl font-black text-white italic uppercase tracking-tighter">Control Contractual OTIC</h1>
                <p class="text-indigo-400 text-[10px] font-bold uppercase mt-1 tracking-widest">Sincronizado con Hoja BASE</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Total Procesos (Columna E)</p>
                    <p id="totalGlobal" class="text-3xl font-black text-emerald-400 font-mono">$0</p>
                </div>
                <button onclick="document.getElementById('setup').classList.toggle('hidden')" class="bg-indigo-600 p-4 rounded-2xl text-white">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <div id="setup" class="hidden mb-8 bg-slate-800/40 p-6 rounded-2xl border border-indigo-500/30">
            <input type="text" id="urlInput" placeholder="Pega la URL del CSV aquí" class="w-full p-4 bg-black/50 rounded-xl text-white border border-slate-700 outline-none mb-4">
            <button onclick="saveUrl()" class="w-full bg-emerald-600 py-4 rounded-xl font-black text-white uppercase tracking-widest">Conectar y Limpiar Tablero</button>
        </div>

        <div id="tablero" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>

    <script>
        async function update() {
            const url = localStorage.getItem('otic_v17_final');
            if (!url) { document.getElementById('setup').classList.remove('hidden'); return; }

            try {
                const res = await fetch(url);
                const csv = await res.text();
                // Detectar si el CSV usa coma o punto y coma
                const sep = csv.split('\n')[2].includes(';') ? ';' : ',';
                const rows = csv.split(/\r?\n/).map(r => r.split(sep).map(c => c.trim().replace(/"/g, '')));
                
                const container = document.getElementById('tablero');
                container.innerHTML = '';
                let grandTotal = 0;

                // Empezamos en la fila 2 (Datos reales)
                for (let i = 2; i < rows.length; i++) {
                    const data = rows[i];
                    
                    // FILTRO MAESTRO:
                    // 1. Debe tener un nombre en la columna C (índice 2)
                    // 2. La columna B (índice 1) debe tener un MES válido (no estar vacía)
                    // Esto evita que las notas de "Diego" se conviertan en tarjetas.
                    if (!data[1] || data[1] === "" || !data[2] || data[2].length < 3) continue;

                    const nombre = data[2];
                    const modalidad = data[3] || "N/A";
                    const presupuesto = parseInt(data[4].replace(/[^0-9]/g, '')) || 0; // Columna E (Índice 4)
                    const respTecnico = data[6] || "Por asignar"; // Columna G (Índice 6)
                    const estadoGral = data[8] || "Sin iniciar";
                    const obs = data[27] || ""; // Columna AB

                    grandTotal += presupuesto;
                    let style = (estadoGral.toLowerCase().includes("atrasado")) ? "atrasado" : 
                                (estadoGral.toLowerCase().includes("completado")) ? "completado" : "en-curso";

                    container.innerHTML += `
                        <div class="card-otic rounded-[2.5rem] p-7 shadow-2xl ${style}">
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-slate-800 text-indigo-400 px-3 py-1 rounded-lg text-[9px] font-black uppercase">${modalidad}</span>
                                <span class="text-[10px] font-bold text-slate-500 uppercase">${data[1]}</span>
                            </div>
                            
                            <h3 class="text-white font-bold text-sm mb-6 h-12 overflow-hidden uppercase italic leading-tight">${nombre}</h3>

                            <div class="grid grid-cols-2 gap-4 border-b border-slate-800 pb-4 mb-4">
                                <div>
                                    <p class="text-[8px] text-slate-500 font-bold uppercase mb-1">Presupuesto</p>
                                    <p class="text-lg font-black text-emerald-400 font-mono">$${presupuesto.toLocaleString('es-CO')}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[8px] text-slate-500 font-bold uppercase mb-1">Responsable Técnico</p>
                                    <p class="text-slate-300 text-[10px] font-bold">${respTecnico}</p>
                                </div>
                            </div>

                            <div class="bg-black/20 p-4 rounded-2xl border border-slate-800/50">
                                <p class="text-[9px] text-indigo-500 font-black uppercase mb-2">Estado: ${estadoGral}</p>
                                <div class="grid grid-cols-2 gap-y-1 text-[10px]">
                                    <span class="text-slate-500 italic">Ficha Técnica:</span> <span class="text-right text-white">${data[5] || '---'}</span>
                                    <span class="text-slate-500 italic">Estudios Previos:</span> <span class="text-right text-white">${data[11] || '---'}</span>
                                    <span class="text-slate-500 italic">ID SECOP:</span> <span class="text-right text-indigo-400">${data[20] || '---'}</span>
                                </div>
                            </div>

                            ${obs.length > 5 ? `
                            <div class="mt-4 p-3 bg-indigo-500/5 border border-indigo-500/10 rounded-xl">
                                <p class="text-[8px] text-indigo-400 font-bold uppercase mb-1 underline">Observaciones:</p>
                                <p class="text-[9px] text-slate-400 italic leading-snug">${obs}</p>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }
                document.getElementById('totalGlobal').innerText = '$' + grandTotal.toLocaleString('es-CO');
            } catch (e) { alert("Error al sincronizar. Revisa la URL."); }
        }

        function saveUrl() {
            const val = document.getElementById('urlInput').value.trim();
            if (val) { localStorage.setItem('otic_v17_final', val); location.reload(); }
        }
        window.onload = update;
    </script>
</body>
</html>
