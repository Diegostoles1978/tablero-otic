<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero OTIC — Versión Final 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .critica { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
        .advertencia { border-left: 4px solid #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .en-curso { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.1); }
        .completado { border-left: 4px solid #6366f1; background: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 font-sans p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-900/50 p-6 rounded-3xl border border-slate-800 backdrop-blur-md">
            <div>
                <h1 class="text-2xl font-black text-white uppercase italic tracking-tighter">Tablero de Control OTIC 2026</h1>
                <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest mt-1">Fuente: Google Sheets — Sincronización Directa</p>
            </div>
            <div class="flex items-center gap-4 mt-4 md:mt-0">
                <div class="text-right">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Total en Gestión</p>
                    <p id="totalGlobal" class="text-2xl font-black text-emerald-400">$0</p>
                </div>
                <button onclick="document.getElementById('config').classList.toggle('hidden')" class="bg-slate-800 p-3 rounded-xl hover:bg-slate-700 transition-all text-white">
                    <i class="fas fa-database"></i>
                </button>
            </div>
        </header>

        <div id="config" class="hidden mb-8 bg-slate-800/50 p-6 rounded-2xl border border-indigo-500/50">
            <p class="text-xs font-bold text-indigo-300 mb-2 uppercase">Configuración de Origen (CSV)</p>
            <input type="text" id="urlInput" placeholder="Pega aquí la URL de publicación (CSV)" class="w-full p-4 bg-black/50 rounded-xl text-white outline-none border border-slate-700 mb-4">
            <button onclick="saveUrl()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-black text-white uppercase tracking-widest transition-all">Vincular y Actualizar</button>
        </div>

        <div id="tablero" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        function getColor(estado) {
            const e = (estado || "").toLowerCase();
            if (e.includes("atrasado")) return "text-red-500 font-bold";
            if (e.includes("en curso")) return "text-amber-400 font-bold";
            if (e.includes("completado")) return "text-emerald-400 font-bold";
            return "text-slate-500";
        }

        async function init() {
            const url = localStorage.getItem('otic_csv_2026');
            if (!url) { document.getElementById('config').classList.remove('hidden'); return; }

            try {
                const response = await fetch(url);
                const data = await response.text();
                const lines = data.split(/\r?\n/).map(line => line.split(',').map(c => c.trim().replace(/"/g, '')));
                
                const container = document.getElementById('tablero');
                container.innerHTML = '';
                let totalSuma = 0;

                // Empezamos en i=2 porque i=0 es el título y i=1 son los encabezados
                for (let i = 2; i < lines.length; i++) {
                    const row = lines[i];
                    if (!row[2]) continue; // Si no hay nombre de proceso, saltamos

                    const nombre = row[2];
                    const modalidad = row[3];
                    const presupuesto = parseInt(row[4]) || 0;
                    const responsable = row[6];
                    const estGeneral = row[8];
                    
                    totalSuma += presupuesto;

                    // Lógica de Alerta de la Tarjeta
                    let cardClass = "en-curso";
                    if (estGeneral.toLowerCase().includes("atrasado")) cardClass = "critica";
                    if (estGeneral.toLowerCase().includes("completado")) cardClass = "completado";

                    container.innerHTML += `
                        <div class="bg-slate-900/40 rounded-[2rem] p-6 border border-slate-800 shadow-xl ${cardClass} transition-transform hover:scale-[1.02]">
                            <div class="mb-4">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-[9px] bg-slate-800 text-slate-400 px-2 py-1 rounded-md font-bold uppercase tracking-widest">${modalidad}</span>
                                    <span class="text-[10px] ${getColor(estGeneral)} uppercase font-black tracking-tighter">${estGeneral}</span>
                                </div>
                                <h3 class="text-white font-bold text-sm leading-tight h-10 overflow-hidden">${nombre}</h3>
                            </div>

                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <div>
                                    <p class="text-[9px] text-slate-500 font-bold uppercase">Presupuesto</p>
                                    <p class="text-emerald-400 font-mono font-bold">$${presupuesto.toLocaleString('es-CO')}</p>
                                </div>
                                <div>
                                    <p class="text-[9px] text-slate-500 font-bold uppercase">Responsable</p>
                                    <p class="text-slate-300 text-[11px] font-medium">${responsable}</p>
                                </div>
                            </div>

                            <div class="space-y-2 border-t border-slate-800 pt-4">
                                ${linea("Ficha Técnica", row[5], row[7])}
                                ${linea("Análisis Sector", row[10], "---")}
                                ${linea("Estudios Previos", row[11], "---")}
                                ${linea("Matriz Riesgos", row[12], "---")}
                                ${linea("SECOP II", row[14], row[16])}
                            </div>
                        </div>
                    `;
                }
                document.getElementById('totalGlobal').innerText = '$' + totalSuma.toLocaleString('es-CO');

            } catch (err) {
                console.error(err);
                alert("Error al procesar el CSV. Revisa que el enlace sea el correcto.");
            }
        }

        function linea(titulo, estado, fecha) {
            return `
                <div class="flex justify-between items-center text-[10px]">
                    <span class="text-slate-500 font-medium">${titulo}</span>
                    <div class="text-right">
                        <span class="${getColor(estado)} mr-2">${estado || '---'}</span>
                        <span class="text-slate-600 font-mono">${fecha && fecha !== '---' ? fecha : ''}</span>
                    </div>
                </div>
            `;
        }

        function saveUrl() {
            const val = document.getElementById('urlInput').value.trim();
            if (val) {
                localStorage.setItem('otic_csv_2026', val);
                location.reload();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
