<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>OTIC</title>https://cdn.tailwindcss.com</head>

<body class="bg-slate-900 text-white p-6">

<div class="max-w-3xl mx-auto">

<h1 class="text-2xl font-bold mb-4">📊 Proyecto Correcto</h1>

<input id="url"
value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQZSnc6zf2k6ICNeut_QXegHFOWtDdiSX_LY4qg1LqP4z3iYNUwcXMdgNaZODcy8Q/pub?output=csv"
class="w-full p-3 text-black rounded mb-4">

<button onclick="load()" class="bg-indigo-600 px-4 py-2 rounded">Cargar</button>

<div id="card" class="mt-6"></div>

</div>

<script>

// ✅ Parser CSV correcto (maneja comas dentro de campos)
function parseCSV(text) {
    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
            row.push(value);
            value = "";
        } else if (char === '\n' && !insideQuotes) {
            row.push(value);
            rows.push(row);
            row = [];
            value = "";
        } else {
            value += char;
        }
    }

    // última celda
    if (value) row.push(value);
    if (row.length) rows.push(row);

    return rows;
}

async function load(){

    const url = document.getElementById("url").value;

    const res = await fetch(url + "&t=" + new Date().getTime());
    const csv = await res.text();

    const rows = parseCSV(csv);

    // encabezados reales
    const headers = rows[1];

    const getIndex = (name) =>
        headers.findIndex(h => h.toLowerCase().includes(name));

    const idxNombre = getIndex("nombre");
    const idxModalidad = getIndex("modalidad");
    const idxPresupuesto = getIndex("presupuesto");
    const idxResponsable = getIndex("responsable");
    const idxEstado = getIndex("estado general");

    let data = null;

    for (let i = 2; i < rows.length; i++) {
        if (rows[i][idxNombre]) {
            data = rows[i];
            break;
        }
    }

    if (!data) return;

    const nombre = data[idxNombre];
    const modalidad = data[idxModalidad];
    const presupuesto = Number(data[idxPresupuesto]) || 0;
    const responsable = data[idxResponsable];
    const estado = data[idxEstado];

    document.getElementById("card").innerHTML = `
        <div class="bg-slate-800 p-6 rounded-xl">

            <h2 class="text-xl font-bold mb-2">${nombre}</h2>

            <p class="text-sm">👤 ${responsable}</p>
            <p class="text-sm">📄 ${modalidad}</p>

            <p class="text-emerald-400 font-mono mb-4">
                💰 $${presupuesto.toLocaleString('es-CO')}
            </p>

            <p class="bg-indigo-600 inline-block px-3 py-1 rounded text-xs">
                Estado: ${estado}
            </p>

        </div>
    `;
}

window.onload = load;

</script>

</body></html>
