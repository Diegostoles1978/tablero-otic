<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba CSV</title>
</head>

<body>

<h2>Prueba conexión Google Sheets</h2>

<button onclick="load()">Cargar Datos</button>

<pre id="output"></pre>

<script>
async function load(){
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZSnc6zf2k6ICNeut_QXegHFOWtDdiSX_LY4qg1LqP4z3iYNUwcXMdgNaZODcy8Q/pub?output=csv";

    try{
        const res = await fetch(url + "&t=" + new Date().getTime());
        const text = await res.text();

        document.getElementById("output").textContent = text;

    }catch(e){
        document.getElementById("output").textContent = "ERROR: " + e;
    }
}
</script>

</body>
</html>
