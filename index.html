<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>OTIC</title><script src="https://cdn.tailwindcss.com"></script></head>

<body class="bg-slate-900 text-white p-6">

<div class="max-w-3xl mx-auto">

<h1 class="text-2xl font-bold mb-4">📊 Proyecto (Correcto)</h1>

<input id="url"
value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQZSnc6zf2k6ICNeut_QXegHFOWtDdiSX_LY4qg1LqP4z3iYNUwcXMdgNaZODcy8Q/pub?output=csv"
class="w-full p-3 text-black rounded mb-4">

<button onclick="load()" class="bg-indigo-600 px-4 py-2 rounded">
Cargar
</button>

<div id="card" class="mt-6"></div>

</div>

<script>

async function load(){

    const url = document.getElementById("url").value;

    const res = await fetch(url + "&t=" + new Date().getTime());
    const csv = await res.text();

    // dividir
    const rows = csv.split(/\r?\n/).map(r => r.split(","));

    // 🔥 obtener encabezados
    const headers = rows[1];

    // 🔥 función para buscar columna por nombre
    const col = name => headers.findIndex(h => h.toLowerCase().includes(name));

    const idx_nombre = col("nombre");
    const idx_modalidad = col("modalidad");
    const idx_presupuesto = col("presupuesto");
    const idx_responsable = col("responsable");
    const idx_estado = col("estado general");

    let data = null;

    for(let i=2;i<rows.length;i++){
        if(rows[i][idx_nombre]){
            data = rows[i];
            break;
        }
    }

    if(!data) return;

    const nombre = data[idx_nombre];
    const modalidad = data[idx_modalidad];
    const presupuesto = parseFloat(data[idx_presupuesto]) || 0;
    const responsable = data[idx_responsable];
    const estado = data[idx_estado];

    document.getElementById("card").innerHTML = `
    <div class="bg-slate-800 p-6 rounded-xl">

        <h2 class="text-xl font-bold mb-2">${nombre}</h2>

        <p class="text-sm">👤 ${responsable}</p>
        <p class="text-sm">📄 ${modalidad}</p>

        <p class="text-emerald-400 font-mono mb-4">
            💰 $${presupuesto.toLocaleString('es-CO')}
        </p>

        <p class="bg-indigo-600 inline-block px-3 py-1 rounded text-xs">
            Estado: ${estado}
        </p>

    </div>`;
}

window.onload = load;

</script>

</body></html>
